# Publica o site estático no GitHub Pages a cada push na branch principal.
# Não há etapa de build: os arquivos da raiz do repositório são o próprio site.
name: Publicar no GitHub Pages

on:
  push:
    branches:
      - main
      - arena/6a6d45f9-clube-de-xadrez-maringa
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Enviar arquivos e publicar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          # tenta ativar o GitHub Pages automaticamente caso ainda não esteja ativo
          enablement: true

      - name: Empacotar site (raiz do repositório)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
